# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
  schedule:
    - cron: '0 13 * * 4'  # 13:00 UTC = 7:00 AM MT (DST), every Thursday

name: update
run-name: Update the USDM Archive with the latest data! 🚀

permissions: write-all

jobs:
  update-usdm:
    name: update-usdm
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: mt-climate-office/actions/setup-geospatial@v1  # repo containing the composite action above
      - name: run
        run: |
          Rscript usdm.R
  
      - name: commit
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add .
          git commit --allow-empty -m 'weekly update'
          git push
          