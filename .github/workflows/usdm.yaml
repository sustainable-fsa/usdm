# Canonical archive-update workflow (sustainable-fsa S3 migration).
# Per repo: replace usdm and the cron, delete the commit-back step heritage.
name: update
run-name: Update the usdm archive → S3

on:
  schedule:
    # NDMC posts Thursdays 8:30 a.m. Eastern = 12:30 UTC in EDT: 13:00 works
    - cron: '0 13 * * 4'
    # ...but 13:30 UTC in EST (Nov-Mar); this second cron covers winter
    # releases and late NDMC postings. Freshness gates make the redundant
    # summer run a cheap no-op cascade.
    - cron: '45 14 * * 4'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**.R', '.github/workflows/**']

permissions:
  id-token: write
  contents: write  # commit-back of rendered README

concurrency:
  group: s3-archive-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -l {0}

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 350
    env:
      S3_BUCKET: sustainable-fsa
      S3_PREFIX: usdm
      AWS_REGION: us-west-2
      CLOUDFRONT_DISTRIBUTION_ID: E1BNL6ONVN84RI
      CLOUDFRONT_BASE: https://data.sustainable-fsa.com
    steps:
      - uses: mt-climate-office/actions/setup-geospatial@v1

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::202533506375:role/sustainable-fsa-github-actions
          aws-region: us-west-2
          role-duration-seconds: 14400

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Update archive
        run: Rscript usdm.R

      # Commit the freshly rendered README (and only it) back to git.
      # README.md text changes only when the data change, so no-op runs
      # skip the commit; PNG byte-noise alone never triggers one.
      - name: Commit refreshed README
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged; skipping commit."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md example-1.png usdm-manifest.json
          git commit -m 'Weekly README render'
          git pull --rebase --autostash origin main
          git push

  # Event-driven chain: downstream repos run when this archive has fresh
  # data, not on guessed cron offsets. Freshness gates in their R scripts
  # make redundant dispatches cheap no-ops. usdm-counties dispatches the
  # second tier (usdm-counties-census-2020, usdm-viz) on its own success.
  dispatch-downstream:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DISPATCH_APP_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: sustainable-fsa
          repositories: |
            usdm-counties
            usdm-counties-fsa-lfp
            usdm-counties-reported
          permission-actions: write

      - name: Dispatch downstream workflows
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOS: >-
            sustainable-fsa/usdm-counties
            sustainable-fsa/usdm-counties-fsa-lfp
            sustainable-fsa/usdm-counties-reported
        run: |
          failed=""
          for repo in $REPOS; do
            ok=""
            for attempt in 1 2 3; do
              if gh workflow run "${repo##*/}.yaml" --repo "$repo" --ref main; then
                echo "Dispatched $repo"; ok=1; break
              fi
              echo "::warning::Dispatch of $repo failed (attempt $attempt)"
              sleep $((attempt * 15))
            done
            [ -n "$ok" ] || failed="$failed $repo"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed to dispatch:$failed — fallback crons will cover, but investigate."
            exit 1
          fi
